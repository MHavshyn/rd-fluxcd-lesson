apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-prod
  namespace: flux-system
spec:
  interval: 1m
  path: ./overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: apps
  targetNamespace: production
  dependsOn:
    - name: infrastructure
  wait: true
  timeout: 5m