---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: dragonfly-upstream
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/dragonflydb/dragonfly-operator
  ref:
    tag: v1.5.0
  ignore: |
    /*
    !/manifests/dragonfly-operator.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: dragonfly-upstream
  path: ./manifests
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: dragonfly-operator-controller-manager
      namespace: dragonfly-operator-system
