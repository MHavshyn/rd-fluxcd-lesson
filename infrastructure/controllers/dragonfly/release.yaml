apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
  namespace: dragonfly-operator-system
spec:
  interval: 30m
  chart:
    spec:
      chart: helm
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: dragonfly-operator
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    createNamespace: false
  upgrade:
    crds: CreateReplace
  values: {}
